spring.application.name=app

# MongoDB - Docker service
spring.mongodb.uri=mongodb://mongodb:27017/employeedb
spring.data.mongodb.auto-index-creation=true

server.servlet.context-path=/api/v1


# Kafka - Docker service
spring.kafka.bootstrap-servers=kafka:9092

# Redis - Docker service
spring.data.redis.host=redis
spring.data.redis.port=6379


# Producer config
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer config
spring.kafka.consumer.group-id=employee-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Don't crash app startup if Kafka broker is unavailable
spring.kafka.listener.missing-topics-fatal=false


# JWT configuration
# ⚠️  Secret is injected at runtime via APP_JWT_SECRET environment variable.
# Set it in docker-compose.yml environment section or a .env file (git-ignored).
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000