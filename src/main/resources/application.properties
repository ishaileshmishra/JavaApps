spring.application.name=app

# Expose specific endpoints (e.g., health, info, and metrics)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true

# MongoDB - local Mac
spring.mongodb.uri=mongodb://localhost:27017/employeedb
spring.data.mongodb.auto-index-creation=true

server.servlet.context-path=/api/v1


# Kafka - local Mac
spring.kafka.bootstrap-servers=localhost:9092

# Redis - local Mac
spring.data.redis.host=localhost
spring.data.redis.port=6379


# Producer config
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer config
spring.kafka.consumer.group-id=employee-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Don't crash app startup if Kafka broker is unavailable
spring.kafka.listener.missing-topics-fatal=false


# JWT configuration
# ⚠️  NEVER commit a real secret here.
# Set APP_JWT_SECRET as an environment variable (shell export or .env file — see .gitignore).
# For local dev, run: export APP_JWT_SECRET=<your-256-bit-hex-secret>
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

spring.kafka.producer.retries=3
spring.kafka.producer.acks=all